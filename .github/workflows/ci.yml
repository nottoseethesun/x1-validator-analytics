# .github/workflows/ci.yml
#
# Continuous integration for x1-validator-analytics: LP Ranger's.
#
# A `check` job per Node version runs `npm run check`, the single gate:
# lint (ESLint, markdownlint, Prettier, actionlint, knip) → the tests, with
# 80% line coverage → the security audits (npm audit, the security lint,
# secretlint).
#
# Triggers: every push to main, every pull request to main, and a manual
# run from the Actions tab.

name: CI
run-name: CI on ${{ github.head_ref || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      # Run every version even if one fails, to see the whole picture.
      fail-fast: false
      matrix:
        # Node 22 = current LTS, Node 24 = latest stable.
        node-version: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm run check (lint + tests + coverage + security audits)
        run: npm run check
